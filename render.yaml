services:
  - type: web
    name: goallord-website
    runtime: node
    plan: free
    region: frankfurt
    # Skip Playwright's ~150MB browser download in the production build — the
    # E2E browser tests are dev-only (devs run `npx playwright install`); the
    # server never launches Playwright. purgecss (also a devDep) still installs.
    buildCommand: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --include=dev && npm run build:css
    startCommand: node server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      # Secrets - set these in the Render dashboard (marked sync:false)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Transactional email via Resend. EMAIL_FROM must be a Resend-verified
      # domain sender. BREVO_API_KEY is still used by utils/sms.js (SMS only).
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Lectures - image generation (Replicate/Flux Schnell) + nightly auto-gen flag
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: REPLICATE_IMAGE_MODEL
        value: black-forest-labs/flux-schnell
      - key: LECTURES_AUTOGEN
        value: "1"
      # Web Push (VAPID) - portal PWA notifications
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: HOST
        sync: false
      # Shared secret for the external scheduler that triggers /api/cron/* jobs.
      # Must match the CRON_SECRET repo secret used by .github/workflows/reminders.yml
      - key: CRON_SECRET
        sync: false
      # Fees & bank details - non-secret config
      - key: APPLICATION_FEE
        value: "20000"
      - key: FULL_TUITION_FEE
        value: "300000"
      - key: MONTHLY_TUITION_FEE
        value: "100000"
      - key: BANK_NAME
        sync: false
      - key: BANK_ACCOUNT_NUMBER
        sync: false
      - key: BANK_ACCOUNT_NAME
        sync: false
      - key: BANK2_NAME
        sync: false
      - key: BANK2_ACCOUNT_NUMBER
        sync: false
      - key: BANK2_ACCOUNT_NAME
        sync: false
